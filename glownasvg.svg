<p><strong>O NAS</strong></p>
<p>Loovbe to kameralna przestrzeń beauty oferująca zabiegi
pielęgnacyjne, kosmetologii estetycznej oraz
stylizacji rzęs i brwi. Miejsce stworzone z myślą
o indywidualnym podejściu, komforcie oraz naturalnym
podkreślaniu urody z dbałością o estetykę i szczegóły.
Gabinet mieści się wewnątrz salonu fryzjerskiego
Graboś Academy.</p>
<p>Dla klientów dostępne jest bezpłatne miejsce parkingowe
nr 20, po lewej stronie od wjazdu na osiedle. </p>
